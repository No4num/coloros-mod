name: Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install APK verification tools
        run: sdkmanager 'build-tools;36.0.0'

      # 签名材料随仓库提交（仅用于本 fork 的固定签名）。storeType 在 app/build.gradle 中固定为 PKCS12。
      - name: Prepare signing properties
        run: |
          cat > signing.properties <<'EOF'
          storeFile=signing/fork.keystore
          storePassword=cosm-fork-2026
          keyAlias=colorosmodfork
          keyPassword=cosm-fork-2026
          EOF

      - name: Build Debug and Release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Verify APK signing identity
        run: python3 scripts/verify-apk-signature.py app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coloros-mod-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
